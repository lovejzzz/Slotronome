<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b2716">
    <meta name="description" content="Slotronome — a pixel-art slot machine metronome that randomises your practice tempo.">
    <title>Slotronome - Musical Slot Machine Metronome</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232d1e0f'/%3E%3Crect x='2' y='4' width='12' height='8' fill='%23120c06'/%3E%3Crect x='3' y='5' width='3' height='6' fill='%23ffcf4d'/%3E%3Crect x='7' y='5' width='2' height='6' fill='%23ffcf4d'/%3E%3Crect x='10' y='5' width='3' height='6' fill='%23ffcf4d'/%3E%3C/svg%3E">
    <!-- Fonts are self-hosted in fonts/ and declared in the stylesheet. No
         rel=preload: it needs crossorigin, which fails when the page is opened
         straight off disk with file://, and these subsets are only ~20KB. -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="scene-glow" aria-hidden="true"></div>

    <div class="container">
        <header class="marquee">
            <div class="marquee-bulbs" aria-hidden="true"></div>
            <h1 class="title" data-text="Slotronome">Slotronome</h1>
            <p class="tagline">Pull the lever &middot; practice every tempo</p>
        </header>

        <div class="slot-machine">
            <div class="cabinet-rivets" aria-hidden="true"></div>

            <div class="slot-display">
                <div class="tempo-display" role="group" aria-label="Tempo">
                    <!-- Time signature placed on the left side of tempo display -->
                    <div class="time-sig-display" id="time-sig-display" role="button" tabindex="0"
                         aria-haspopup="dialog" aria-label="Time signature: 4/4. Activate to change."
                         title="Click, scroll or drag to change time signature">4/4</div>
                    
                    <div class="digit-container" role="spinbutton" tabindex="0"
                         aria-label="Hundreds digit of tempo" aria-valuemin="10" aria-valuemax="500"
                         title="Scroll, drag or use arrow keys">
                        <div class="digit-roller" id="hundreds-roller">
                            <div class="digit">0</div>
                            <div class="digit">1</div>
                            <div class="digit">2</div>
                            <div class="digit">3</div>
                        </div>
                        <div class="reel-glass" aria-hidden="true"></div>
                    </div>
                    <div class="digit-container" role="spinbutton" tabindex="0"
                         aria-label="Tens digit of tempo" aria-valuemin="10" aria-valuemax="500"
                         title="Scroll, drag or use arrow keys">
                        <div class="digit-roller" id="tens-roller">
                            <div class="digit">0</div>
                            <div class="digit">1</div>
                            <div class="digit">2</div>
                            <div class="digit">3</div>
                            <div class="digit">4</div>
                            <div class="digit">5</div>
                            <div class="digit">6</div>
                            <div class="digit">7</div>
                            <div class="digit">8</div>
                            <div class="digit">9</div>
                        </div>
                        <div class="reel-glass" aria-hidden="true"></div>
                    </div>
                    <div class="digit-container" role="spinbutton" tabindex="0"
                         aria-label="Ones digit of tempo" aria-valuemin="10" aria-valuemax="500"
                         title="Scroll, drag or use arrow keys">
                        <div class="digit-roller" id="ones-roller">
                            <div class="digit">0</div>
                            <div class="digit">1</div>
                            <div class="digit">2</div>
                            <div class="digit">3</div>
                            <div class="digit">4</div>
                            <div class="digit">5</div>
                            <div class="digit">6</div>
                            <div class="digit">7</div>
                            <div class="digit">8</div>
                            <div class="digit">9</div>
                        </div>
                        <div class="reel-glass" aria-hidden="true"></div>
                    </div>

                    <div class="bpm-tag" aria-hidden="true">BPM</div>

                    <!-- Add cogwheel control for BPM adjustment -->
                    <div class="tempo-gear-container">
                        <div class="tempo-gear" id="tempo-gear" role="slider" tabindex="0"
                             aria-label="Tempo fine adjust" aria-valuemin="10" aria-valuemax="500"
                             title="Drag or use arrow keys to fine-tune the tempo">
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-tooth" aria-hidden="true"></div>
                            <div class="gear-center" aria-hidden="true"></div>
                        </div>
                    </div>
                </div>
                <div class="tempo-input-overlay" id="tempo-input-overlay">
                    <div class="input-container" role="dialog" aria-modal="true" aria-labelledby="set-bpm-heading">
                        <h3 id="set-bpm-heading">Set BPM</h3>
                        <div class="number-input-large">
                            <button class="minus">-</button>
                            <input type="number" id="direct-tempo-input" min="10" max="500" value="90">
                            <button class="plus">+</button>
                        </div>
                        <div class="input-help">
                            Shift+click: ±5 BPM<br>
                            Ctrl+click: ±10 BPM
                        </div>
                        <div class="overlay-buttons">
                            <button id="cancel-tempo-btn" class="pixel-button">Cancel</button>
                            <button id="apply-tempo-btn" class="pixel-button">Apply</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="slot-handle-container">
                <div class="handle-mount" aria-hidden="true"></div>
                <div class="slot-handle" id="slot-handle" role="button" tabindex="0"
                     aria-label="Pull the lever to spin a new tempo"
                     title="Pull, or press L, to spin a new tempo">
                    <div class="handle-knob" aria-hidden="true"></div>
                    <div class="handle-arm" aria-hidden="true"></div>
                </div>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="min-tempo">Min Tempo</label>
                    <div class="number-input">
                        <button class="minus">-</button>
                        <input type="number" id="min-tempo" value="60" min="10" max="500">
                        <button class="plus">+</button>
                    </div>
                    
                    <label for="max-tempo" class="stacked">Max Tempo</label>
                    <div class="number-input">
                        <button class="minus">-</button>
                        <input type="number" id="max-tempo" value="90" min="10" max="500">
                        <button class="plus">+</button>
                    </div>
                </div>
                
                <!-- Remove time signature from controls and add it as a hidden select for the popup -->
                <div id="time-signature-popup" class="time-signature-popup">
                    <div class="ts-panel" role="dialog" aria-modal="true" aria-labelledby="ts-heading">
                        <h3 id="ts-heading">Time Signature</h3>
                        <select id="time-signature" class="pixel-select">
                        <!-- Denominator 2 -->
                        <option value="2/2">2/2</option>
                        <option value="3/2">3/2</option>
                        
                        <!-- Denominator 4 -->
                        <option value="2/4">2/4</option>
                        <option value="3/4">3/4</option>
                        <option value="4/4" selected>4/4</option>
                        <option value="5/4">5/4</option>
                        <option value="6/4">6/4</option>
                        
                        <!-- Denominator 8 -->
                        <option value="3/8">3/8</option>
                        <option value="4/8">4/8</option>
                        <option value="5/8">5/8</option>
                        <option value="6/8">6/8</option>
                        <option value="7/8">7/8</option>
                        <option value="9/8">9/8</option>
                        <option value="12/8">12/8</option>
                        </select>
                        <p class="ts-hint">Pick a meter, or scroll the 4/4 plate</p>
                    </div>
                </div>
                
                <div class="control-row">
                    <div class="control-group">
                        <label for="change-type">Change Type</label>
                        <select id="change-type" class="pixel-select">
                            <option value="random" selected>Random</option>
                            <option value="increment">Increment</option>
                        </select>
                        <div class="limit-checkbox">
                            <input type="checkbox" id="limit-increment" checked>
                            <label for="limit-increment">Limit</label>
                        </div>
                    </div>
                    
                    <!-- Increment container (moved between change type and change tempo) -->
                    <div id="increment-container" class="control-group" style="display: none;">
                        <label for="increment-value">Increment</label>
                        <div class="number-input">
                            <button class="minus">-</button>
                            <input type="number" id="increment-value" value="2" min="-20" max="20">
                            <button class="plus">+</button>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label for="bars-to-change">Change Every</label>
                        <div class="number-input">
                            <button class="minus">-</button>
                            <input type="number" id="bars-to-change" value="0" min="0" max="16">
                            <button class="plus">+</button>
                        </div>
                        <div class="bars-label">bars</div>
                    </div>
                </div>
            </div>
            
            <div class="accent-controls">
                <span class="panel-caption">Accents</span>
                <div id="accent-buttons" class="quarter-notes-container"></div>
            </div>

            <div class="playback-controls">
                <button id="start-stop-btn" class="start">START</button>
            </div>

            <p class="shortcuts">
                <kbd>Space</kbd> play &middot; <kbd>L</kbd> lever &middot;
                <kbd>&uarr;</kbd><kbd>&darr;</kbd> tempo &middot; <kbd>1</kbd>&ndash;<kbd>9</kbd> accent
            </p>

            <div class="cabinet-plate" aria-hidden="true">SLOTRONOME &middot; MOD. 4/4</div>
        </div>
    </div>
    
    <p id="sr-status" class="visually-hidden" role="status" aria-live="polite"></p>

    <script src="js/app.js"></script>
</body>
</html>
